class ApiError extends Error {
  constructor(code, message, http) { super(message); this.code = code; this.http = http; }
}
// Toda solicitud lleva el actor en X-Usuario-Id (spec D-06). Los errores llegan como
// { error: { codigo, mensaje } } (spec §11.1). Sin respuesta del servidor → OFFLINE.
async function api(path, { actorId, method = 'GET', body } = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-Usuario-Id': actorId },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new ApiError('OFFLINE', `Sin conexión con el servidor (${API_BASE}).`, 0);
  }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const e = new ApiError(data?.error?.codigo || 'ERROR', data?.error?.mensaje || `Error HTTP ${res.status}.`, res.status);
    e.conflictos = data?.error?.conflictos;   // solo en el error de RN-05 (spec §11.10)
    throw e;
  }
  return data;
}
const toIso = (ts) => new Date(ts).toISOString().replace(/\.\d{3}Z$/, 'Z');
const enc = encodeURIComponent;
const qs = (o) => new URLSearchParams(Object.entries(o).filter(([, v]) => v != null)).toString();

  cancelar: (actorId, turnoId, motivo) =>

  eliminarBloqueo: (actorId, id) => api(`/api/bloqueos/${enc(id)}/eliminar`, { actorId, method: 'POST' }),
  cerrarTurno: (actorId, turnoId, accion) => api(`/api/turnos/${enc(turnoId)}/${accion}`, { actorId, method: 'POST' }),
  auditoria: (actorId) => api('/api/auditoria', { actorId }),

// Turno de la API (spec §11.2) → forma que usa la UI. El rol de quien canceló no es campo

function turnoDeApi(t, users) {
  const por = users.find((u) => u.id === t.cancelado_por_id);

}

/* ============================ 3. TIEMPO ============================ */
const pad = (n) => String(n).padStart(2, '0');
const dayStart = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); };
const atMin = (dayTs, m) => { const d = new Date(dayTs); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); };
const minOfDay = (ts) => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); };
const overlaps = (aS, aE, bS, bE) => aS < bE && bS < aE; // intervalos [inicio, fin)
const isBusinessDay = (ts) => { const w = new Date(ts).getDay(); return w >= 1 && w <= 5; };
const addBusinessDays = (ts, n) => {
  let t = ts, left = Math.abs(n); const step = n < 0 ? -1 : 1;
  while (left > 0) { t = addDays(t, step); if (isBusinessDay(t)) left--; }
  return t;
};
const weekStart = (ts) => addDays(dayStart(ts), -((new Date(ts).getDay() + 6) % 7));
const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
const fmtDate = (ts) => cap(new Date(ts).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' }));
const fmtDateLong = (ts) => cap(new Date(ts).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtDT = (ts) => `${fmtDate(ts)} · ${fmtTime(ts)}`;
const toInputDT = (ts) => `${toInputDate(ts)}T${fmtTime(ts)}`;
const fromInputDT = (s) => new Date(s).getTime();
const toInputDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fromInputDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const fmtDur = (ms) => { const m = Math.max(0, Math.round(ms / MIN)); const h = Math.floor(m / 60); return h ? `${h} h ${m % 60} min` : `${m} min`; };

function canClientCancel(t, now) {
  if (t.estado !== 'CONFIRMADO') return { ok: false, reason: 'El turno ya no está confirmado.' };
  if (now >= t.inicio) return { ok: false, reason: 'El turno ya comenzó.' };

  return { ok: true };
}

function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    const h = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 sm:p-4" role="dialog" aria-modal="true" aria-label={title}
      onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className={`${card} w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-lg'} max-h-[92vh] overflow-y-auto rounded-b-none sm:rounded-b-xl`}>

          <button className="rounded-md p-1 hover:bg-slate-100 dark:hover:bg-slate-800" onClick={onClose} aria-label="Cerrar"><Icon name="x" /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

/* ============================ 7. VISTA CLIENTE ============================ */
function BookingModal({ svc, inicio, onClose }) {
  const { state, call, clientId, toast } = useApp();
  const me = userOf(state, clientId);
  const prof = userOf(state, svc.profesionalId);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const [sim, setSim] = useState({ race: false, double: false });
  const fin = inicio + svc.duracionMin * MIN;

  const submit = async () => {
    if (busy) return;
    setBusy(true);
    if (sim.race) {
      // Otro cliente real reserva el mismo slot un instante antes: el Backend debe rechazar el mío.
      const other = state.users.find((u) => u.role === 'CLIENTE' && u.id !== clientId && u.emailVerificado);
      const r = await call(() => Api.reservar(other.id, svc.id, inicio), { silent: true, refresh: false });
      if (r.ok) toast('info', `${other.nombre} reservó este horario un instante antes que vos.`);
    }
    let r;
    if (sim.double) {
      // Doble clic: dos POST simultáneos. Exactamente uno puede confirmarse (INV-02).
      const [a, b] = await Promise.all([1, 2].map(() => call(() => Api.reservar(clientId, svc.id, inicio), { silent: true })));
      r = a.ok ? a : b.ok ? b : a;
      const otro = r === a ? b : a;
      if (r.ok && !otro.ok) toast('info', `El segundo envío fue rechazado: ${otro.error.code}.`);
    } else {
      r = await call(() => Api.reservar(clientId, svc.id, inicio), { silent: true });
    }
    setBusy(false);
    if (r.ok) { setDone(turnoDeApi(r.data, state.users)); setError(null); } else setError(r.error);
  };

  if (done) {
    return (
      <Modal title="Turno confirmado" onClose={onClose}>
        <div className="space-y-3">
          <Notice tone="ok" icon="checkCircle">Tu reserva quedó <b>CONFIRMADA</b> y guardada en el servidor.</Notice>
          <dl className="grid grid-cols-[auto,1fr] gap-x-4 gap-y-1 text-sm">

        </div>
        <div className={`${card} p-3 text-sm`}>
          <div className={`text-xs font-medium ${muted}`}>Datos de contacto (perfil guardado en el servidor, RN-03)</div>

        </div>

            <label className="flex items-start gap-2"><input type="checkbox" className="mt-1" checked={sim.double} onChange={(e) => setSim({ ...sim, double: e.target.checked })} />Enviar la reserva dos veces en paralelo (doble clic).</label>

// GET /api/disponibilidad (spec §11.9): los slots los calcula el servidor con los turnos de todos los clientes.
function useDisponibilidad(actorId, svc, day, version) {
  const [res, setRes] = useState({ loading: true, slots: [], error: null });
  useEffect(() => {
    if (!svc) return undefined;
    let vivo = true;
    setRes((r) => ({ ...r, loading: true }));
    Api.disponibilidad(actorId, svc.id, toInputDate(day))
      .then((d) => vivo && setRes({ loading: false, error: null, slots: d.map((x) => ({ inicio: Date.parse(x.inicio), fin: Date.parse(x.fin) })) }))
      .catch((e) => vivo && setRes({ loading: false, error: e, slots: [] }));
    return () => { vivo = false; };
  }, [actorId, svc?.id, svc?.activo, day, version]);
  return res;
}

/* ============================ 8. VISTA ADMINISTRADOR ============================ */
function TurnoDetail({ turnoId, actor, onClose }) {
  const { state, call, auditMode } = useApp();
  const t = state.turnos.find((x) => x.id === turnoId);
  const [motivo, setMotivo] = useState('');
  const [cancelling, setCancelling] = useState(false);
  const [error, setError] = useState(null);
  if (!t) return null;
  const sv = svcOf(state, t.servicioId), cli = userOf(state, t.clienteId), prof = userOf(state, t.profesionalId);
  const visible = inScope(actor, t.profesionalId);
  const confirmado = t.estado === 'CONFIRMADO';
  const canComplete = confirmado && state.now >= t.inicio, canNoShow = confirmado && state.now >= t.fin, canCancel = confirmado && state.now < t.inicio;
  const run = async (fn, success) => {
    const r = await call(fn, { success, silent: true });
    if (r.ok) onClose(); else setError(r.error);
  };
  return (
    <Modal title="Turno" onClose={onClose}>
      <div className="space-y-4 text-sm">
        <div className="flex items-center justify-between"><div className="font-semibold">{sv?.nombre}</div><Badge estado={t.estado} /></div>
        <dl className="grid grid-cols-[auto,1fr] gap-x-4 gap-y-1">
          <dt className={muted}>Id</dt><dd className="font-mono text-xs break-all">{t.id}</dd>
          <dt className={muted}>Profesional</dt><dd>{prof?.nombre}</dd>
          <dt className={muted}>Horario</dt><dd>{fmtDate(t.inicio)} · {fmtTime(t.inicio)} a {fmtTime(t.fin)}</dd>
          <dt className={muted}>Cliente</dt><dd>{visible ? cli?.nombre : <i>Sin acceso (RBAC-04)</i>}</dd>
          <dt className={muted}>Contacto</dt><dd>{visible && cli ? `${cli.email} · ${cli.telefono}` : <i>Sin acceso (RBAC-04)</i>}</dd>
          {t.estado === 'CANCELADO' && <><dt className={muted}>Cancelación</dt><dd>{t.canceladoRol}{t.motivo ? ` · ${t.motivo}` : ''}</dd></>}
        </dl>
        {error && <ErrorNotice error={error} />}
        {cancelling ? (
          <div className="space-y-3">
            {canCancel && t.inicio - state.now < CONFIG.CANCEL_WINDOW_H * HOUR && <Notice tone="warn">Faltan menos de {CONFIG.CANCEL_WINDOW_H} h: se aplica la excepción de RN-01 para Administrador/Profesional.</Notice>}
            <Field label="Motivo de la cancelación (obligatorio)"><textarea className={inputCls} rows={3} value={motivo} onChange={(e) => setMotivo(e.target.value)} autoFocus /></Field>
            <div className="flex justify-end gap-2">
              <button className={btnGhost} onClick={() => setCancelling(false)}>Volver</button>
              <button className={btnDanger} onClick={() => run(() => Api.cancelar(actor.id, t.id, motivo), 'Turno cancelado.')}>Cancelar turno</button>
            </div>
          </div>
        ) : (
          <div className="flex flex-wrap justify-end gap-2">
            <button className={btnGhost} disabled={!canComplete && !auditMode} title={canComplete ? '' : 'Solo desde el inicio del turno'}
              onClick={() => run(() => Api.cerrarTurno(actor.id, t.id, 'completar'), 'Turno completado.')}><Icon name="checkCircle" />Completar</button>
            <button className={btnGhost} disabled={!canNoShow && !auditMode} title={canNoShow ? '' : 'Solo una vez finalizado el turno'}
              onClick={() => run(() => Api.cerrarTurno(actor.id, t.id, 'ausente'), 'Turno marcado como ausente.')}><Icon name="alert" />Ausente</button>
            <button className={btnDanger} disabled={!canCancel && !auditMode} title={canCancel ? '' : 'Solo antes del inicio'} onClick={() => setCancelling(true)}><Icon name="ban" />Cancelar…</button>
          </div>
        )}
      </div>
    </Modal>
  );
}

function AdminAgenda({ actor, scopeIds }) {
  const { state } = useApp();
  const [mode, setMode] = useState('semana');
  const [anchor, setAnchor] = useState(() => dayStart(state.now));
  const [estadoF, setEstadoF] = useState('TODOS');
  const [open, setOpen] = useState(null);
  const turnos = state.turnos.filter((t) => scopeIds.includes(t.profesionalId)).sort((a, b) => a.inicio - b.inicio);
  const blocks = state.blocks.filter((b) => scopeIds.includes(b.profesionalId));
  const days = mode === 'semana' ? Array.from({ length: 7 }, (_, i) => addDays(weekStart(anchor), i)) : [dayStart(anchor)];
  const step = mode === 'semana' ? 7 : 1;
  const showProf = scopeIds.length > 1;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="inline-flex rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden text-sm">
          {[['semana', 'Semana'], ['dia', 'Día'], ['lista', 'Lista']].map(([k, l]) => (
            <button key={k} aria-pressed={mode === k} onClick={() => setMode(k)} className={`px-3 py-1.5 ${mode === k ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>{l}</button>
          ))}
        </div>
        {mode !== 'lista' ? (
          <>
            <button className={btnGhost} aria-label="Anterior" onClick={() => setAnchor(addDays(anchor, -step))}><Icon name="left" /></button>
            <button className={btnGhost} onClick={() => setAnchor(dayStart(state.now))}>Hoy</button>
            <button className={btnGhost} aria-label="Siguiente" onClick={() => setAnchor(addDays(anchor, step))}><Icon name="right" /></button>
            <span className="text-sm font-medium">{mode === 'semana' ? `${fmtDate(days[0])} – ${fmtDate(days[6])}` : fmtDateLong(days[0])}</span>
          </>
        ) : (
          <select className={`${inputCls} w-auto`} value={estadoF} onChange={(e) => setEstadoF(e.target.value)} aria-label="Filtrar por estado">
            {['TODOS', 'CONFIRMADO', 'COMPLETADO', 'CANCELADO', 'AUSENTE'].map((e) => <option key={e}>{e}</option>)}
          </select>
        )}
      </div>

      {mode === 'lista' ? (
        <div className="space-y-2">
          {turnos.filter((t) => estadoF === 'TODOS' || t.estado === estadoF).map((t) => (
            <div key={t.id} className="flex items-center gap-3"><span className={`w-28 shrink-0 text-xs ${muted}`}>{fmtDate(t.inicio)}</span><div className="flex-1"><TurnoCard t={t} actor={actor} onOpen={setOpen} showProf={showProf} /></div></div>
          ))}
          {turnos.length === 0 && <p className={`text-sm ${muted}`}>Sin turnos.</p>}
        </div>
      ) : (
        <div className={`grid gap-3 ${mode === 'semana' ? 'md:grid-cols-4 xl:grid-cols-7' : ''}`}>
          {days.map((d) => {
            const items = turnos.filter((t) => dayStart(t.inicio) === d);
            const bl = blocks.filter((b) => overlaps(d, addDays(d, 1), b.inicio, b.fin));
            const isToday = d === dayStart(state.now);
            return (
              <div key={d} className={`${card} p-2 min-h-[8rem] ${isToday ? 'ring-2 ring-indigo-400' : ''}`}>
                <div className={`mb-2 text-xs font-semibold ${isToday ? 'text-indigo-600 dark:text-indigo-300' : muted}`}>{fmtDate(d)}{isToday && ' · hoy'}</div>
                <div className="space-y-2">
                  {bl.map((b) => (
                    <div key={b.id} className="hatch rounded-lg border border-slate-300 dark:border-slate-600 p-2 text-xs">
                      <div className="font-semibold flex items-center gap-1"><Icon name="lock" size={12} />Bloqueo</div>
                      <div>{fmtTime(Math.max(b.inicio, d))}–{b.fin >= addDays(d, 1) ? '24:00' : fmtTime(b.fin)}{b.motivo ? ` · ${b.motivo}` : ''}</div>
                      {showProf && <div className={muted}>{userOf(state, b.profesionalId)?.nombre}</div>}
                    </div>
                  ))}
                  {items.map((t) => <TurnoCard key={t.id} t={t} actor={actor} onOpen={setOpen} showProf={showProf} />)}
                  {!items.length && !bl.length && <p className={`text-xs ${muted}`}>Sin turnos</p>}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {open && <TurnoDetail turnoId={open} actor={actor} onClose={() => setOpen(null)} />}
    </div>
  );
}

// GET /api/metricas (spec §11.13): calculadas en el servidor.
function AdminMetrics({ actor, profFiltro }) {
  const { state } = useApp();
  const [period, setPeriod] = useState('semana');
  const [res, setRes] = useState({ loading: true, m: null, error: null });
  const rango = useMemo(() => {
    if (period === 'semana') { const f = weekStart(state.now); return [f, addDays(f, 7)]; }
    if (period === 'mes') { const d = new Date(state.now); return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime()]; }
    return [addDays(dayStart(state.now), -300), addDays(dayStart(state.now), CONFIG.HORIZON_DAYS + 1)];   // a lo sumo 366 días
  }, [period, dayStart(state.now)]);
  useEffect(() => {
    let vivo = true;
    setRes((r) => ({ ...r, loading: true }));
    Api.metricas(actor.id, rango[0], rango[1], profFiltro)
      .then((m) => vivo && setRes({ loading: false, m, error: null }))
      .catch((e) => vivo && setRes({ loading: false, m: null, error: e }));
    return () => { vivo = false; };
  }, [actor.id, profFiltro, rango[0], rango[1], state.turnos]);
  const m = res.m;
  const porDia = m ? m.turnos_por_dia : [];
  const maxDay = Math.max(1, ...porDia.map((x) => x.cantidad));
  const maxTop = Math.max(1, ...(m ? m.top_servicios.map((x) => x.cantidad) : []));
  return (
    <div className="space-y-4">
      <div className="inline-flex rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden text-sm">
        {[['semana', 'Semana actual'], ['mes', 'Mes actual'], ['todo', 'Todo']].map(([k, l]) => (
          <button key={k} aria-pressed={period === k} onClick={() => setPeriod(k)} className={`px-3 py-1.5 ${period === k ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}>{l}</button>
        ))}
      </div>
      {res.error && <ErrorNotice error={res.error} />}
      {res.loading && !m && <p className={`text-sm ${muted}`}>Calculando…</p>}
      {m && (
        <>
          <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
            <Stat label="Turnos en el período" value={m.total} sub={`${m.por_estado.CONFIRMADO} confirmados · ${m.por_estado.COMPLETADO} completados`} />
            <Stat label="Tasa de cancelación" value={pct(m.tasa_cancelacion)} sub={`Cliente ${m.cancelaciones_por_rol.CLIENTE} · Prof. ${m.cancelaciones_por_rol.PROFESIONAL} · Admin ${m.cancelaciones_por_rol.ADMIN}`} />
            <Stat label="Tasa de ausentismo" value={pct(m.tasa_ausentismo)} sub={`${m.por_estado.AUSENTE} ausentes sobre ${m.por_estado.COMPLETADO + m.por_estado.AUSENTE} cerrados`} />
            <Stat label="Ocupación" value={pct(m.ocupacion)} sub={`${m.minutos_reservados} de ${m.minutos_disponibles} min`} />
          </div>
          <div className="grid gap-4 lg:grid-cols-2">
            <div className={`${card} p-4`}>
              <h3 className="font-semibold mb-3 text-sm">Turnos por día (confirmados y completados)</h3>
              {porDia.length === 0 ? <p className={`text-sm ${muted}`}>Sin datos.</p> : (
                <div className="flex items-end gap-1 h-32">
                  {porDia.map((x) => (
                    <div key={x.fecha} className="flex-1 flex flex-col items-center justify-end gap-1 min-w-0" title={`${x.fecha}: ${x.cantidad}`}>
                      <span className="text-[10px]">{x.cantidad}</span>
                      <div className="w-full rounded-t bg-indigo-500" style={{ height: `${(x.cantidad / maxDay) * 100}%`, minHeight: 4 }} />
                      <span className={`text-[9px] ${muted}`}>{Number(x.fecha.slice(8))}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className={`${card} p-4`}>
              <h3 className="font-semibold mb-3 text-sm">Servicios más reservados</h3>
              {m.top_servicios.length === 0 && <p className={`text-sm ${muted}`}>Sin datos.</p>}
              <ul className="space-y-2">
                {m.top_servicios.map((x) => (
                  <li key={x.servicio_id} className="text-sm">
                    <div className="flex justify-between"><span>{svcOf(state, x.servicio_id)?.nombre || x.servicio_id}</span><span className="font-semibold">{x.cantidad}</span></div>
                    <div className="h-2 rounded bg-slate-200 dark:bg-slate-700"><div className="h-2 rounded bg-indigo-500" style={{ width: `${(x.cantidad / maxTop) * 100}%` }} /></div>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// POST /api/bloqueos (spec §11.10): con turnos en el rango, el servidor devuelve los conflictos (RN-05).
function AdminBlocks({ actor, scopeIds, profs }) {
  const { state, call, toast } = useApp();
  const defStart = atMin(addBusinessDays(dayStart(state.now), 3), 12 * 60);
  const [form, setForm] = useState({ profesionalId: scopeIds[0], inicio: toInputDT(defStart), fin: toInputDT(defStart + HOUR), motivo: '' });
  const [conflict, setConflict] = useState(null);
  const [error, setError] = useState(null);
  const blocks = state.blocks.filter((b) => scopeIds.includes(b.profesionalId)).sort((a, b) => a.inicio - b.inicio);
  useEffect(() => { if (!scopeIds.includes(form.profesionalId)) setForm((f) => ({ ...f, profesionalId: scopeIds[0] })); }, [scopeIds]);
  const crear = async (confirmar) => {
    const r = await call(() => Api.crearBloqueo(actor.id, form.profesionalId, fromInputDT(form.inicio), fromInputDT(form.fin), form.motivo, confirmar), { silent: true });
    if (r.ok) {
      setConflict(null); setError(null);
      const n = r.data.turnos_cancelados.length;
      toast('ok', n ? `Bloqueo creado y ${n} turno(s) cancelado(s).` : 'Bloqueo creado.');
    } else if (r.error.conflictos) { setConflict(r.error); setError(null); }
    else if (confirmar) setConflict({ ...conflict, ultimo: r.error });
    else setError(r.error);
  };
  return (
    <div className="grid gap-4 lg:grid-cols-[1fr,1.2fr]">
      <div className={`${card} p-4 space-y-3`}>
        <h3 className="font-semibold flex items-center gap-2"><Icon name="lock" />Nuevo bloqueo</h3>
        <Field label="Profesional">
          <select className={inputCls} value={form.profesionalId} onChange={(e) => setForm({ ...form, profesionalId: e.target.value })}>
            {profs.filter((p) => scopeIds.includes(p.id)).map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
          </select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Desde"><input type="datetime-local" step="900" className={inputCls} value={form.inicio} onChange={(e) => setForm({ ...form, inicio: e.target.value })} /></Field>
          <Field label="Hasta"><input type="datetime-local" step="900" className={inputCls} value={form.fin} onChange={(e) => setForm({ ...form, fin: e.target.value })} /></Field>
        </div>
        <Field label="Motivo"><input className={inputCls} value={form.motivo} onChange={(e) => setForm({ ...form, motivo: e.target.value })} placeholder="Vacaciones, almuerzo, imprevisto…" /></Field>
        {error && <ErrorNotice error={error} />}
        <button className={btnPrimary} onClick={() => crear(false)}><Icon name="plus" />Crear bloqueo</button>
      </div>
      <div className={`${card} p-4`}>
        <h3 className="font-semibold mb-3">Bloqueos</h3>
        {blocks.length === 0 && <p className={`text-sm ${muted}`}>No hay bloqueos.</p>}
        <ul className="space-y-2">
          {blocks.map((b) => (
            <li key={b.id} className="hatch flex items-center justify-between gap-2 rounded-lg border border-slate-300 dark:border-slate-600 p-3 text-sm">
              <div><div className="font-semibold">{b.motivo || 'Bloqueo'}</div><div>{fmtDT(b.inicio)} → {fmtDT(b.fin)}</div><div className={`text-xs ${muted}`}>{userOf(state, b.profesionalId)?.nombre}</div></div>
              <button className={btnGhost} onClick={() => call(() => Api.eliminarBloqueo(actor.id, b.id), { success: 'Bloqueo eliminado.' })} aria-label="Eliminar bloqueo"><Icon name="trash" /></button>
            </li>
          ))}
        </ul>
      </div>
      {conflict && (
        <Modal title="Conflicto con turnos confirmados" onClose={() => setConflict(null)}>
          <div className="space-y-3 text-sm">
            <Notice tone="warn" icon="alert"><b className="font-mono">{conflict.code}</b> · HTTP {conflict.http} · {conflict.message}</Notice>
            <ul className="space-y-1">
              {conflict.conflictos.map((x) => turnoDeApi(x, state.users)).map((t) => (
                <li key={t.id} className="rounded border border-slate-200 dark:border-slate-700 p-2">{fmtDT(t.inicio)} · {svcOf(state, t.servicioId)?.nombre} · {userOf(state, t.clienteId)?.nombre}</li>
              ))}
            </ul>
            <Field label="Motivo (obligatorio para cancelar los turnos)"><input className={inputCls} value={form.motivo} onChange={(e) => setForm({ ...form, motivo: e.target.value })} /></Field>
            {conflict.ultimo && <ErrorNotice error={conflict.ultimo} />}
            <div className="flex justify-end gap-2">
              <button className={btnGhost} onClick={() => setConflict(null)}>No bloquear</button>
              <button className={btnDanger} onClick={() => crear(true)}>Cancelar turnos y bloquear</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// GET / POST /api/horarios (spec §11.8, D-09).
function AdminHorarios({ actor, scopeIds, profs }) {
  const { state, call } = useApp();
  const [profId, setProfId] = useState(scopeIds[0]);
  const actuales = () => state.horarios.filter((h) => h.profesional_id === profId).map((h) => ({ dia_semana: h.dia_semana, hora_inicio: h.hora_inicio, hora_fin: h.hora_fin }));
  const [franjas, setFranjas] = useState(actuales);
  const [error, setError] = useState(null);
  useEffect(() => { if (!scopeIds.includes(profId)) setProfId(scopeIds[0]); }, [scopeIds]);
  useEffect(() => { setFranjas(actuales()); setError(null); }, [profId, state.horarios]);
  const set = (i, k, v) => setFranjas(franjas.map((f, j) => (j === i ? { ...f, [k]: v } : f)));
  const guardar = async () => {
    const r = await call(() => Api.reemplazarHorario(actor.id, profId, franjas.map((f) => ({ ...f, dia_semana: Number(f.dia_semana) }))), { success: 'Horario actualizado.', silent: true });
    setError(r.ok ? null : r.error);
  };
  return (
    <div className={`${card} p-4 space-y-3`}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <h3 className="font-semibold">Horario laboral semanal</h3>
        <select className={`${inputCls} w-auto`} value={profId} onChange={(e) => setProfId(e.target.value)} aria-label="Profesional">
          {profs.filter((p) => scopeIds.includes(p.id)).map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
        </select>
      </div>
      {franjas.length === 0 && <p className={`text-sm ${muted}`}>Sin franjas: el profesional no recibe reservas.</p>}
      <ul className="space-y-2">
        {franjas.map((f, i) => (
          <li key={i} className="flex flex-wrap items-center gap-2 text-sm">
            <select className={`${inputCls} w-auto`} value={f.dia_semana} onChange={(e) => set(i, 'dia_semana', e.target.value)} aria-label="Día">
              {DIAS.map((d, n) => <option key={n} value={n}>{d}</option>)}
            </select>
            <input type="time" step="900" className={`${inputCls} w-auto`} value={f.hora_inicio} onChange={(e) => set(i, 'hora_inicio', e.target.value)} aria-label="Desde" />
            <span>a</span>
            <input className={`${inputCls} w-24`} value={f.hora_fin} onChange={(e) => set(i, 'hora_fin', e.target.value)} aria-label="Hasta" placeholder="HH:MM" />
            <button className={btnGhost} onClick={() => setFranjas(franjas.filter((_, j) => j !== i))} aria-label="Quitar franja"><Icon name="trash" /></button>
          </li>
        ))}
      </ul>
      {error && <ErrorNotice error={error} />}
      <div className="flex flex-wrap gap-2">
        <button className={btnGhost} onClick={() => setFranjas([...franjas, { dia_semana: 1, hora_inicio: '09:00', hora_fin: '13:00' }])}><Icon name="plus" />Agregar franja</button>
        <button className={btnPrimary} onClick={guardar}><Icon name="check" />Guardar horario</button>
      </div>
      <p className={`text-xs ${muted}`}>D-09: los turnos ya confirmados se conservan; el horario nuevo rige para las reservas nuevas.</p>
    </div>
  );
}

            className={`inline-flex items-center gap-1.5 whitespace-nowrap px-3 py-2 text-sm font-medium border-b-2 -mb-px ${tab === k ? 'border-indigo-600 text-indigo-700 dark:text-indigo-300' : 'border-transparent hover:bg-slate-100 dark:hover:bg-slate-800'}`}><Icon name={ic} />{l}</button>

      {tab === 'agenda' && <AdminAgenda actor={actor} scopeIds={scopeIds} />}
      {tab === 'metricas' && <AdminMetrics actor={actor} profFiltro={profFiltro} />}

      {tab === 'horarios' && <AdminHorarios actor={actor} scopeIds={scopeIds} profs={profs} />}
      {tab === 'servicios' && <AdminServices actor={actor} scopeIds={scopeIds} />}

/* ============================ 9. APP ============================ */
function App() {
  const [now, setNow] = useState(() => Date.now());
  const [datos, setDatos] = useState({ turnos: [], services: [], horarios: [], blocks: [] });
  const [conexion, setConexion] = useState('cargando'); // cargando | ok | offline
  const [view, setView] = useState('cliente');
  const [clientId, setClientId] = useState(ID.c1);
  const [adminId, setAdminId] = useState(ID.admin);
  const [auditMode, setAuditMode] = useState(false);
  const [toasts, setToasts] = useState([]);
  const viewerId = view === 'cliente' ? clientId : adminId;
  const esStaff = USERS.find((u) => u.id === viewerId)?.role !== 'CLIENTE';

  // Reloj real: el Backend usa la hora UTC real (plan §3.1). No hay reloj simulado.
  useEffect(() => { const h = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(h); }, []);

  const toast = useCallback((type, text, code, http) => {
    const id = Math.random();
    setToasts((t) => [...t, { id, type, text, code, http }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 6000);
  }, []);

  // Todo sale del Backend: al iniciar, al cambiar de usuario y después de cada acción (plan §3.1).
  // Si el servidor no responde NO se vuelve a datos en memoria (plan §2): se vacía todo.
  const refresh = useCallback(async () => {
    try {
      const [turnos, servicios, horarios, bloqueos] = await Promise.all([
        Api.listarTurnos(viewerId), Api.servicios(viewerId), Api.horarios(viewerId),
        esStaff ? Api.bloqueos(viewerId) : Promise.resolve([]),
      ]);
      setDatos({ turnos: turnos.map((t) => turnoDeApi(t, USERS)), services: servicios.map(servicioDeApi), horarios, blocks: bloqueos.map(bloqueoDeApi) });
      setConexion('ok');
    } catch (e) {
      setDatos({ turnos: [], services: [], horarios: [], blocks: [] });
      if (e.code === 'OFFLINE') setConexion('offline');
      else toast('error', e.message, e.code, e.http);
    }
    setNow(Date.now());
  }, [viewerId, esStaff, toast]);
  useEffect(() => { setConexion('cargando'); refresh(); }, [refresh]);

  // Ejecuta una llamada a la API y muestra el resultado que decide el servidor.
  const call = async (fn, opts = {}) => {
    let r;
    try { r = { ok: true, data: await fn() }; if (opts.success) toast('ok', opts.success); }
    catch (e) {
      r = { ok: false, error: e };
      if (e.code === 'OFFLINE') setConexion('offline');
      if (!opts.silent) toast('error', e.message, e.code, e.http);
    }
    if (opts.refresh !== false) await refresh();
    return r;
  };

  const state = { users: USERS, now, ...datos };
  const clients = USERS.filter((u) => u.role === 'CLIENTE');
  const staff = USERS.filter((u) => u.role !== 'CLIENTE');
  const ctx = { state, call, toast, clientId, adminId, auditMode };

  return (
    <AppCtx.Provider value={ctx}>
      <header className="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur">
        <div className="mx-auto max-w-7xl px-4 py-3 flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-2 font-bold text-indigo-700 dark:text-indigo-300"><Icon name="calendar" size={20} />Turnos Pro</div>
          <div className="inline-flex rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden text-sm" role="group" aria-label="Rol">
            {[['cliente', 'Vista Cliente', 'user'], ['admin', 'Vista Administrador', 'shield']].map(([k, l, ic]) => (
              <button key={k} aria-pressed={view === k} onClick={() => setView(k)}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 font-medium ${view === k ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}`}><Icon name={ic} />{l}</button>
            ))}
          </div>
          {view === 'cliente'
            ? <select className={`${inputCls} w-auto`} value={clientId} onChange={(e) => setClientId(e.target.value)} aria-label="Cliente activo">
                {clients.map((c) => <option key={c.id} value={c.id}>{c.nombre}{c.emailVerificado ? '' : ' (email sin verificar)'}</option>)}
              </select>
            : <select className={`${inputCls} w-auto`} value={adminId} onChange={(e) => setAdminId(e.target.value)} aria-label="Usuario administrador activo">
                {staff.map((c) => <option key={c.id} value={c.id}>{c.nombre} · {c.role}</option>)}
              </select>}
          <label className="inline-flex items-center gap-2 text-sm cursor-pointer" title="Habilita los botones que la UI normalmente deshabilita, para comprobar que el servidor igualmente rechaza la acción">
            <input type="checkbox" checked={auditMode} onChange={(e) => setAuditMode(e.target.checked)} />Modo auditoría
          </label>
        </div>
        <div className="border-t border-slate-100 dark:border-slate-800">
          <div className="mx-auto max-w-7xl px-4 py-2 flex flex-wrap items-center gap-2 text-sm">
            <span className="inline-flex items-center gap-1.5 font-medium"><Icon name="clock" />Hora real: {fmtDT(now)}</span>
            <span className={`text-xs ${muted}`}>(el servidor usa la hora real; no hay reloj simulado)</span>
            <span className="ml-auto flex items-center gap-2">
              <span className={`inline-flex items-center gap-1.5 text-xs font-semibold ${conexion === 'ok' ? 'text-emerald-700 dark:text-emerald-300' : conexion === 'offline' ? 'text-red-700 dark:text-red-300' : muted}`}>
                <Icon name="server" size={14} />{conexion === 'ok' ? `Conectado a ${API_BASE}` : conexion === 'offline' ? 'Sin conexión' : 'Conectando…'}
              </span>
              <button className={btnGhost} onClick={refresh}><Icon name="rotate" />Recargar</button>
            </span>
          </div>
        </div>
      </header>
      <main className="mx-auto max-w-7xl px-4 py-6 space-y-4">
        {conexion === 'offline' && (
          <Notice tone="error" icon="alert">
            <b>Sin conexión con el servidor</b> ({API_BASE}). Los turnos no se muestran ni se pueden reservar hasta que vuelva la conexión.
            Levantá el backend con <span className="font-mono">python -m uvicorn main:app --port 8000</span> desde <span className="font-mono">backend/</span>.
            <div className="mt-2"><button className={btnGhost} onClick={refresh}><Icon name="rotate" />Reintentar</button></div>
          </Notice>
        )}
        {view === 'cliente' ? <ClientView key={clientId} /> : <AdminView key={adminId} />}
      </main>
      <Toasts toasts={toasts} />
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
